<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pico W monitor</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;background:#071a2a;color:#eaf6ff;font:16px system-ui}.app{max-width:960px;margin:auto;padding:30px 18px}.tag,p{color:#9cb4c5}.tag{color:#52d5ef;text-transform:uppercase;font-size:12px;letter-spacing:1px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.chart{background:#102f42;border:1px solid #285067;border-radius:16px;padding:22px}.num{font-size:54px;font-weight:bold;margin:15px 0}.chart{height:360px;margin-top:16px}@media(max-width:650px){.cards{grid-template-columns:1fr}.chart{height:280px}}</style><main class="app"><p class="tag">Raspberry Pi Pico W · DHT22</p><h1>Monitor prostredia</h1><section class="cards"><article class="card"><p>Teplota</p><div class="num"><span id="t">—</span> °C</div><p id="u">Čakám na dáta</p></article><article class="card"><p>Vlhkosť</p><div class="num"><span id="h">—</span> %</div><p>Aktuálne meranie</p></article><article class="card"><p>Aktuálny čas</p><div class="num" id="c">—</div><p id="d"></p></article></section><section class="chart"><p class="tag">História meraní</p><canvas id="g"></canvas></section></main><script>const DB='https://web-na-teplotu-default-rtdb.firebaseio.com',q=x=>document.getElementById(x);let ch=new Chart(q('g'),{type:'line',data:{labels:[],datasets:[{label:'Teplota °C',data:[],borderColor:'#ff956b',tension:.3},{label:'Vlhkosť %',data:[],borderColor:'#52d5ef',tension:.3}]},options:{responsive:true,maintainAspectRatio:false}});function clock(){let x=new Date();q('c').textContent=x.toLocaleTimeString('sk-SK');q('d').textContent=x.toLocaleDateString('sk-SK')}async function load(){try{let x=await(await fetch(DB+'/merania.json')).json(),a=x?Object.entries(x).map(([k,v])=>({...v,n:Number(v.timestamp||k)||0})).sort((m,n)=>m.n-n.n):[];if(!a.length){let v=await(await fetch(DB+'/senzor.json')).json();if(v)a=[v]}let z=a.at(-1);q('t').textContent=Number(z.teplota).toFixed(1);q('h').textContent=Number(z.vlhkost).toFixed(1);q('u').textContent=z.timestamp?new Date(z.timestamp*1000).toLocaleString('sk-SK'):'Čas merania sa neukladá';ch.data.labels=a.map(v=>v.timestamp?new Date(v.timestamp*1000).toLocaleTimeString('sk-SK'):'meranie');ch.data.datasets[0].data=a.map(v=>v.teplota);ch.data.datasets[1].data=a.map(v=>v.vlhkost);ch.update()}catch(e){q('u').textContent='Dáta nie sú dostupné'}}clock();load();setInterval(clock,1000);setInterval(load,15000)</script>
